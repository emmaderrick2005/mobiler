services:
  postgres:
    image: postgres:16-alpine
    container_name: cashdelivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cashdelivery
      POSTGRES_PASSWORD: cashdelivery
      POSTGRES_DB: cashdelivery
    ports:
      - "5432:5432"
    volumes:
      - cashdelivery_pgdata:/var/lib/postgresql/data

volumes:
  cashdelivery_pgdata:
