services:
  postgres:
    image: postgres:16-alpine
    container_name: cashdelivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cashdelivery_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    container_name: cashdelivery-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      REQUEST_ACCEPT_WINDOW_SECONDS: ${REQUEST_ACCEPT_WINDOW_SECONDS}
      NODE_ENV: ${NODE_ENV}
      ENABLE_DEV_OTP: ${ENABLE_DEV_OTP}
      AT_USERNAME: ${AT_USERNAME}
      AT_API_KEY: ${AT_API_KEY}
      SMS_DEFAULT_COUNTRY_CODE: ${SMS_DEFAULT_COUNTRY_CODE}
    ports:
      - "4000:4000"
    volumes:
      - cashdelivery_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
    container_name: cashdelivery-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  cashdelivery_pgdata:
  cashdelivery_uploads:
